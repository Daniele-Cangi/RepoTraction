name: Demand-first native target proof

on:
  pull_request:
    paths:
      - 'docs/experiments/demand-first-target-2026-10-11/**'
      - 'docs/experiments/recursion-direct-attempt-2026-10-12/**'
      - 'docs/experiments/technical-obstacle-selection-2026-10-12/**'
      - 'docs/experiments/arborescence-obstacle-2026-10-12/**'
      - '.github/workflows/demand-first-native.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  networkx-arborescence:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: networkx/networkx
          ref: 6da4704cbf32ba6f50f6d9c46cc0a071e3a87985
          path: networkx-target
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Install native test dependencies
        run: >-
          python -m pip install --only-binary=:all:
          setuptools==80.9.0 pytest==8.4.2 numpy==2.3.3 scipy==1.17.1 pandas==2.3.3
      - name: Install the pinned native package metadata
        run: python -m pip install --no-deps --no-build-isolation -e ./networkx-target
      - name: Replay the frozen native candidate and regressions
        shell: python {0}
        run: |
          import hashlib, json, os, statistics, subprocess, sys, time
          from pathlib import Path

          repo = Path.cwd()
          target = repo / 'networkx-target'
          study = repo / 'docs/experiments/arborescence-obstacle-2026-10-12'
          output = Path(os.environ['RUNNER_TEMP']) / 'networkx-arborescence-results'
          output.mkdir(parents=True, exist_ok=True)
          canonical = lambda p: p.read_bytes().replace(b'\r\n', b'\n')
          sha = lambda b: hashlib.sha256(b).hexdigest()
          preparation = json.loads((study / 'preparation.json').read_text())
          frozen = json.loads((study / 'direct-attempt/freeze.json').read_text())
          replay = json.loads((study / 'candidate-replay.json').read_text())
          revision = subprocess.check_output(['git', '-C', str(target), 'rev-parse', 'HEAD'], text=True).strip()
          assert revision == preparation['native_target_commit'] == frozen['baseline_pin']
          original = canonical(target / 'networkx/algorithms/tree/branchings.py')
          assert sha(original) == preparation['native_branchings_sha256']
          patch = output / 'candidate.patch'
          patch.write_bytes(canonical(study / 'direct-attempt/complete.patch'))
          assert sha(patch.read_bytes()) == replay['patch_canonical_sha256']
          env = dict(os.environ, PYTHONPATH=str(target), PYTEST_DISABLE_PLUGIN_AUTOLOAD='1')
          records = dict(target_pin=revision, python=sys.version, observations=[], summaries=[])

          def observe(label, arguments, timeout):
              command = [sys.executable, *arguments]
              start = time.perf_counter()
              try:
                  done = subprocess.run(command, cwd=target, env=env, capture_output=True, timeout=timeout)
                  code, data, expired = done.returncode, done.stdout + done.stderr, False
              except subprocess.TimeoutExpired as error:
                  code, data, expired = None, (error.stdout or b'') + (error.stderr or b''), True
              row = dict(label=label, command=command, timeout_seconds=timeout,
                         exit_code=code, timed_out=expired, process_wall_seconds=time.perf_counter()-start,
                         output=data.decode('utf-8', errors='replace'))
              records['observations'].append(row)
              (output / 'assessment.json').write_text(json.dumps(records, indent=2)+'\n', encoding='utf-8')
              print(label, code, expired, round(row['process_wall_seconds'], 3), flush=True)
              assert not expired and code == 0, row
              return row

          observe('original-tree', ['-m', 'pytest', '-q', 'networkx/algorithms/tree/tests', '-ra'], 120)
          subprocess.run(['git', '-C', str(target), 'apply', str(patch)], check=True)
          module = target / 'networkx/algorithms/tree/branchings.py'
          candidate = canonical(module)
          assert sha(candidate) == replay['files_canonical_sha256']['networkx/algorithms/tree/branchings.py']
          assert sha(canonical(target / 'networkx/algorithms/tree/tests/test_branchings_integer.py')) == replay['files_canonical_sha256']['networkx/algorithms/tree/tests/test_branchings_integer.py']
          observe('candidate-independent-oracle', [str(study / 'native_acceptance.py')], 30)
          observe('candidate-tree', ['-m', 'pytest', '-q', 'networkx/algorithms/tree/tests', '-ra'], 120)
          try:
              for n, seed in ((50, 20261012), (100, 20261012), (200, 20261012), (75, 20261013), (150, 20261013)):
                  values = {'original': [], 'candidate': []}
                  for trial in range(1, 4):
                      for mode, source in (('original', original), ('candidate', candidate)):
                          module.write_bytes(source)
                          row = observe(f'{mode}-{n}-{seed}-{trial}', [str(study / 'measure_native.py'), str(n), str(seed)], 30)
                          measured = json.loads(row['output'])
                          assert Path(measured['networkx_module']).resolve() == (target / 'networkx/__init__.py').resolve()
                          assert measured['is_spanning_arborescence'] and measured['input_unchanged']
                          assert measured['answer_edges'] == n-1
                          values[mode].append(measured)
                  assert len({s['graph_sha256'] for rows in values.values() for s in rows}) == 1
                  assert len({s['weight'] for rows in values.values() for s in rows}) == 1
                  before = statistics.median(s['algorithm_wall_seconds'] for s in values['original'])
                  after = statistics.median(s['algorithm_wall_seconds'] for s in values['candidate'])
                  records['summaries'].append(dict(nodes=n, seed=seed, original_median_seconds=before,
                                                   candidate_median_seconds=after, speedup=before/after))
                  # The frozen performance gate is local. Hosted timing is retained
                  # as platform evidence, with exact answer equality required.
          finally:
              module.write_bytes(candidate)
              (output / 'assessment.json').write_text(json.dumps(records, indent=2)+'\n', encoding='utf-8')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: networkx-arborescence-${{ matrix.os }}
          path: ${{ runner.temp }}/networkx-arborescence-results
          if-no-files-found: error
  pytest-recursion:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: pytest-dev/pytest
          ref: aec0291ed14c724873bfcea99d5dfd739f75a68f
          path: pytest-target
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Install native test dependencies
        run: >-
          python -m pip install --only-binary=:all:
          iniconfig==2.3.1 packaging==26.3 pluggy==1.6.0
          pygments==2.21.0 colorama==0.4.6 hypothesis==6.169.0
          attrs==26.1.0 sortedcontainers==2.4.0
      - name: Compare the frozen reproduction and run native regressions
        shell: python {0}
        run: |
          import ast, hashlib, json, os, platform, subprocess, sys, time
          from pathlib import Path

          repo = Path.cwd()
          target = repo / 'pytest-target'
          study = repo / 'docs/experiments/recursion-direct-attempt-2026-10-12'
          frozen = repo / 'docs/experiments/technical-obstacle-selection-2026-10-12'
          output = Path(os.environ['RUNNER_TEMP']) / 'pytest-recursion-results'
          output.mkdir(parents=True, exist_ok=True)
          canonical = lambda path: path.read_bytes().replace(b'\r\n', b'\n')
          sha = lambda data: hashlib.sha256(data).hexdigest()
          preparation = json.loads((study / 'preparation.json').read_text())
          manifest = json.loads((study / 'candidate-manifest.json').read_text())
          revision = subprocess.check_output(['git', '-C', str(target), 'rev-parse', 'HEAD'], text=True).strip()
          assert revision == preparation['target_revision'] == manifest['target_revision']
          assert sha(canonical(target / 'src/_pytest/_code/code.py')) == preparation['target_module_canonical_sha256']
          for name, expected in preparation['inputs'].items():
              assert sha(canonical(frozen / name)) == expected['canonical_sha256'], name
          fixtures = json.loads((frozen / 'portable-fixture-manifest.json').read_text())['fixtures']
          for name, expected in fixtures.items():
              assert sha(canonical(frozen / name)) == expected['canonical_sha256'], name
          assert sha((study / 'agent.patch').read_bytes()) == manifest['patch_sha256']
          patch = output / 'candidate.patch'
          patch.write_bytes(canonical(study / 'agent.patch'))
          assert sha(patch.read_bytes()) == manifest['patch_canonical_sha256']
          # Only ignored packaging metadata; the pinned implementation is unchanged.
          (target / 'src/_pytest/_version.py').write_text(
              "__version__ = version = '9.2.0.dev0'\n"
              "__version_tuple__ = version_tuple = (9, 2, 0, 'dev0')\n"
              "__commit_id__ = commit_id = None\n", encoding='utf-8')
          reproduction = output / 'reported_recursion.py'
          reproduction.write_bytes(canonical(frozen / 'reported_recursion.py'))
          env = dict(os.environ, PYTHONPATH=str(target / 'src'), PYTEST_DISABLE_PLUGIN_AUTOLOAD='1')
          result = dict(target_revision=revision, python=sys.version, platform=platform.platform(), observations=[])

          def observe(label, arguments, timeout=15):
              command = [sys.executable, *arguments]
              start = time.perf_counter()
              try:
                  completed = subprocess.run(command, cwd=target, env=env, capture_output=True, timeout=timeout)
                  code, data, expired = completed.returncode, completed.stdout + completed.stderr, False
              except subprocess.TimeoutExpired as error:
                  code, data, expired = None, (error.stdout or b'') + (error.stderr or b''), True
              row = dict(label=label, command=command, timeout_seconds=timeout,
                         exit_code=code, timed_out=expired, wall_seconds=time.perf_counter()-start,
                         output_sha256=sha(data), output=data.decode('utf-8', errors='replace'))
              result['observations'].append(row)
              (output / 'assessment.json').write_text(json.dumps(result, indent=2)+'\n', encoding='utf-8')
              print(label, code, expired, round(row['wall_seconds'], 3), flush=True)
              return row

          def useful(row):
              assert not row['timed_out'] and row['exit_code'] == 2, row['label']
              assert all(s in row['output'] for s in ('RecursionError', 'reported_recursion.py', 'in func')), row['label']

          arguments = ['-m', 'pytest', '-q', str(reproduction), '--capture=no']
          baseline = observe('original-ordinary', arguments)
          if not baseline['timed_out']:
              useful(baseline)  # A faster platform need not reproduce the Windows timeout.
          useful(observe('original-native', arguments + ['--tb=native']))
          assert observe('original-frozen-probe', [str(frozen / 'native_diagnostic_probe.py')])['exit_code'] == 0
          subprocess.run(['git', '-C', str(target), 'apply', str(patch)], check=True)
          for name, expected in manifest['files'].items():
              assert sha(canonical(target / name)) == expected['canonical_sha256'], name
          for number in range(1, 4):
              ordinary = observe(f'candidate-ordinary-{number}', arguments)
              useful(ordinary)
              useful(observe(f'candidate-native-{number}', arguments + ['--tb=native']))
              assert 'a repeated state may have been missed' in ordinary['output']
              assert 'same locals & position' not in ordinary['output']
          # Retain the full historical probe failure: its large exact no-match
          # expectation is incompatible with the explicitly disclosed work cap.
          retained = observe('candidate-unmodified-frozen-probe', [str(frozen / 'native_diagnostic_probe.py')])
          assert not retained['timed_out'] and retained['exit_code'] == 1
          assert '_RecursionSearchLimitExceeded' in retained['output']
          tree = ast.parse((frozen / 'native_diagnostic_probe.py').read_text())
          removed = [n for n in tree.body if isinstance(n, ast.For) and isinstance(n.target, ast.Name) and n.target.id == 'n']
          assert len(removed) == 1 and ast.literal_eval(removed[0].iter) == (20, 40, 80, 160)
          semantic = ast.Module(body=[n for n in tree.body if n not in removed], type_ignores=[])
          controls = observe('candidate-original-six-controls', ['-c', ast.unparse(semantic)])
          assert controls['exit_code'] == 0 and len(json.loads(controls['output'])['semantic_controls']) == 6
          tests = observe('candidate-native-code-directory', ['-m', 'pytest', '-q', 'testing/code', '-rs'], timeout=120)
          print(tests['output'])
          assert tests['exit_code'] == 0
          result['complete'] = True
          (output / 'assessment.json').write_text(json.dumps(result, indent=2)+'\n', encoding='utf-8')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-recursion-${{ matrix.os }}
          path: ${{ runner.temp }}/pytest-recursion-results
          if-no-files-found: error
  target-http:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: pganssle/audio-feeder
          ref: 2a5b58dab43a5195ccc964916bbddaf7f8727c1d
          path: external-target
          persist-credentials: false
      - name: Build isolated native target
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/native-context/target" "$RUNNER_TEMP/native-context/study" "$RUNNER_TEMP/native-results"
          git -C external-target archive HEAD | tar -x -C "$RUNNER_TEMP/native-context/target"
          cp docs/experiments/demand-first-target-2026-10-11/{native_http.py,acceptance.json} "$RUNNER_TEMP/native-context/study/"
          cp docs/experiments/demand-first-target-2026-10-11/Dockerfile "$RUNNER_TEMP/native-context/Dockerfile"
          docker build -t demand-first-target "$RUNNER_TEMP/native-context"
          docker image inspect demand-first-target --format '{{.Id}}' > "$RUNNER_TEMP/native-results/image-id.txt"
      - name: Exercise actual application and upstream route regressions
        shell: bash
        run: |
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" \
            --read-only --tmpfs /tmp:rw,size=512m \
            -v "$RUNNER_TEMP/native-results:/results" demand-first-target \
            sh -ec 'cp /dependencies.txt /results/; python /study/native_http.py /results'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demand-first-native-results
          path: ${{ runner.temp }}/native-results
          if-no-files-found: error
