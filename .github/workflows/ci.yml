name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Verify source startup options
        run: python app.py --help

      - name: Verify Windows install and update preserve data
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $testDestination = Join-Path $env:RUNNER_TEMP "RepoTraction-install-smoke"
          ./install.ps1 -NoShortcut -Destination $testDestination
          $historyFile = Join-Path $testDestination "data/smoke.sqlite3"
          [System.IO.File]::WriteAllText($historyFile, "preserve-me")
          $configFile = Join-Path $testDestination ".env"
          [System.IO.File]::WriteAllText($configFile, "# preserve-local-configuration")
          ./install.ps1 -NoShortcut -Destination $testDestination
          if ([System.IO.File]::ReadAllText($historyFile) -ne "preserve-me") { throw "Update replaced history" }
          if ([System.IO.File]::ReadAllText($configFile) -ne "# preserve-local-configuration") { throw "Update replaced local configuration" }
          if (-not (Test-Path (Join-Path $testDestination "scripts/bootstrap_missing_link_wasi.py"))) { throw "Optional runner tools are missing" }
          python (Join-Path $testDestination "app.py") --help
          python -I -c "import sys, json; from pathlib import Path; from types import SimpleNamespace; sys.path.insert(0, sys.argv[1]); import github_cli; assert Path(github_cli.__file__).resolve() == Path(sys.argv[1]).resolve() / 'github_cli.py'; result = SimpleNamespace(returncode=0, stdout=json.dumps({'hosts': {'github.com': [{'active': True, 'state': 'success', 'login': 'fixture'}]}})); assert github_cli.verify_cli_account('fixture', run=lambda *args, **kwargs: result) == 'fixture'" $testDestination
          python -c "import sys; sys.path.insert(0, sys.argv[1]); from missing_link.service import Service" $testDestination
          python -I -c "import sys; from pathlib import Path; sys.path.insert(0, sys.argv[1]); from analytics import traffic; assert Path(traffic.__file__).resolve().parent == Path(sys.argv[1]).resolve() / 'analytics'; assert traffic.percentage_change(15, 10) == 50.0" $testDestination
          python -I -c "import sys; from pathlib import Path; sys.path.insert(0, sys.argv[1]); from analytics import events; assert Path(events.__file__).resolve().parent == Path(sys.argv[1]).resolve() / 'analytics'; assert events._utc_date('2026-08-10').isoformat() == '2026-08-10'; assert events.describe_event_outcome({})['outcome_key'] == 'collecting'" $testDestination
          python -I -c "import sys; from pathlib import Path; sys.path.insert(0, sys.argv[1]); from analytics import repositories; assert Path(repositories.__file__).resolve().parent == Path(sys.argv[1]).resolve() / 'analytics'; assert repositories.build_adoption_signal(36, 31)['key'] == 'broad'; assert repositories.repository_health({}, is_profile=False, pushed_days_ago=None)['score'] == 30" $testDestination
          python -I -c "import sys; from pathlib import Path; sys.path.insert(0, sys.argv[1]); from analytics import opportunities; assert Path(opportunities.__file__).resolve().parent == Path(sys.argv[1]).resolve() / 'analytics'; items, rows = opportunities.build_repository_opportunities({'full_name': 'octocat/project'}, {'views_7d': 5, 'previous_views': 0, 'views_comparison_ready': True}, {'score': 100, 'gaps': [], 'notes': [], 'pushed_days_ago': 150, 'applicable': True}); ranked, readiness = opportunities.rank_opportunities(items, rows); assert [item['kind'] for item in ranked] == ['freshness', 'momentum']; assert readiness[0]['score'] == 100" $testDestination
          python -I -c "import sys; from datetime import date; from pathlib import Path; sys.path.insert(0, sys.argv[1]); from analytics import event_evidence; assert Path(event_evidence.__file__).resolve().parent == Path(sys.argv[1]).resolve() / 'analytics'; rows = event_evidence.select_event_post_rows([{'day': '2026-08-16', 'value': 0}], event_day=date(2026, 8, 16), today=date(2026, 8, 18), created_day=None); assert len(rows) == 1; assert event_evidence.event_evidence_unavailable(metric='views', today=date(2026, 8, 18), latest_day='2026-08-15', window_days=1, baseline_days=1)['status'] == 'stale_upstream'" $testDestination
          $storageCheck = @'
          import sys
          from pathlib import Path
          sys.path.insert(0, sys.argv[1])
          from storage import database, migrations, registry, repository_snapshots
          for module in (database, migrations, registry, repository_snapshots):
              assert Path(module.__file__).resolve().parent == Path(sys.argv[1]).resolve() / 'storage'
          with database.database_connection(':memory:') as connection:
              migrations.migrate_database(connection)
              assert connection.execute('SELECT initialized FROM repository_registry_state').fetchone() == (0,)
              assert registry.read_active_repository_rows(connection) is None
              registry.reconcile_current_repositories(connection, {1: 'octocat/project'}, {}, {'octocat/project'}, '2026-08-20')
              assert registry.read_active_repository_rows(connection)[0][0] == 'octocat/project'
              registry.save_repository_alias(connection, 'octocat/old', 1, 'octocat/project', 'renamed', '2026-08-20')
              assert connection.execute('SELECT status FROM repository_aliases').fetchone()[0] == 'renamed'
              repository_snapshots.save_repo_snapshots(connection, [{'full_name': 'octocat/project', 'stars': 7}], '2026-08-20')
              assert connection.execute('SELECT stars FROM repo_snapshots').fetchone()[0] == 7
              def record_event(connection, **event):
                  return repository_snapshots.record_repository_event(connection, **event, validate_repo=str, utc_now=lambda: '2026-08-21')
              assert repository_snapshots.save_repo_metadata_snapshots(connection, [{'full_name': 'octocat/project'}], '2026-08-20', validate_repo=str, record_event=record_event) == 0
              assert repository_snapshots.save_repo_metadata_snapshots(connection, [{'full_name': 'octocat/project', 'description': 'new'}], '2026-08-21', validate_repo=str, record_event=record_event) == 1
              assert connection.execute("SELECT COUNT(*) FROM repository_events WHERE event_type = 'metadata'").fetchone()[0] == 1
          '@
          python -I -c $storageCheck $testDestination
