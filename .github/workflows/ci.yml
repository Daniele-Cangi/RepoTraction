name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Verify source startup options
        run: python app.py --help

      - name: Verify Windows install and update preserve data
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $testDestination = Join-Path $env:RUNNER_TEMP "RepoTraction-install-smoke"
          ./install.ps1 -NoShortcut -Destination $testDestination
          $historyFile = Join-Path $testDestination "data/smoke.sqlite3"
          [System.IO.File]::WriteAllText($historyFile, "preserve-me")
          $configFile = Join-Path $testDestination ".env"
          [System.IO.File]::WriteAllText($configFile, "# preserve-local-configuration")
          ./install.ps1 -NoShortcut -Destination $testDestination
          if ([System.IO.File]::ReadAllText($historyFile) -ne "preserve-me") { throw "Update replaced history" }
          if ([System.IO.File]::ReadAllText($configFile) -ne "# preserve-local-configuration") { throw "Update replaced local configuration" }
          if (-not (Test-Path (Join-Path $testDestination "scripts/bootstrap_missing_link_wasi.py"))) { throw "Optional runner tools are missing" }
          python (Join-Path $testDestination "app.py") --help
          python -c "import sys; sys.path.insert(0, sys.argv[1]); from missing_link.service import Service" $testDestination
          python -I -c "import sys; from pathlib import Path; sys.path.insert(0, sys.argv[1]); from analytics import traffic; assert Path(traffic.__file__).resolve().parent == Path(sys.argv[1]).resolve() / 'analytics'; assert traffic.percentage_change(15, 10) == 50.0" $testDestination
          python -I -c "import sys; from pathlib import Path; sys.path.insert(0, sys.argv[1]); from analytics import events; assert Path(events.__file__).resolve().parent == Path(sys.argv[1]).resolve() / 'analytics'; assert events._utc_date('2026-08-10').isoformat() == '2026-08-10'; assert events.describe_event_outcome({})['outcome_key'] == 'collecting'" $testDestination
